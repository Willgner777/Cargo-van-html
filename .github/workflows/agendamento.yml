name: Disparo Diario WhatsApp

on:
  schedule:
    # 08:00 Brasília (11:00 UTC) - Segunda a Sábado
    - cron: '0 11 * * 1-6'
    # 17:00 Brasília (20:00 UTC) - Segunda a Sábado
    - cron: '0 20 * * 1-6'
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Descobrir qual script rodar
        run: |
          # Se a hora atual UTC for 11 (08h no Brasil), roda despesas.
          # Se for 20 (17h no Brasil), roda operações.
          HORA_ATUAL=$(date -u +%H)
          echo "Hora UTC atual: $HORA_ATUAL"
          
          if [ "$HORA_ATUAL" -eq 11 ]; then
            echo "SCRIPT_PARA_RODAR=enviar_despesas.js" >> $GITHUB_ENV
          elif [ "$HORA_ATUAL" -eq 20 ]; then
            echo "SCRIPT_PARA_RODAR=enviar_operacoes.js" >> $GITHUB_ENV
          else
            # Caso seja acionado manualmente via workflow_dispatch, roda o de operações por padrão
            echo "SCRIPT_PARA_RODAR=enviar_operacoes.js" >> $GITHUB_ENV
          fi

      - name: Executar Script Selecionado
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          WHATSAPP_NUMERO: ${{ secrets.WHATSAPP_NUMERO }}
        run: node ${{ env.SCRIPT_PARA_RODAR }}
