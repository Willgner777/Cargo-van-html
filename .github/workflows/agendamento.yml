name: Disparo Diario WhatsApp

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 08:00 Brasília
  workflow_dispatch:

jobs:
  enviar-mensagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # <-- Atualizado de '20' para '24'
      - name: Executar Script (Teste Direto)
        run: node enviar_resumo.js
