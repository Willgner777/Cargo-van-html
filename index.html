function showView(viewName) {
    const mainOp = document.getElementById('operacao-view');
    const mainDesp = document.getElementById('despesas-view');
    const navItems = document.querySelectorAll('.sidebar-menu .sidebar-item');

    if (viewName === 'despesas') {
        if (mainOp) mainOp.classList.add('view-hidden');
        if (mainDesp) mainDesp.classList.remove('view-hidden');
        navItems[0].classList.remove('active');
        navItems[1].classList.add('active');
    } else {
        if (mainOp) mainOp.classList.remove('view-hidden');
        if (mainDesp) mainDesp.classList.add('view-hidden');
        navItems[1].classList.remove('active');
        navItems[0].classList.add('active');
    }
}

const pulsePointsPlugin = {
    id: 'pulsePointsPlugin',
    afterDatasetsDraw(chart) {
        if (chart.canvas.id !== 'lineChart') return;
        const meta = chart.getDatasetMeta(0);
        if (!meta || !meta.data || meta.data.length === 0) return;

        const { ctx } = chart;
        const t = performance.now() / 1000;
        const lastIndex = meta.data.length - 1;

        meta.data.forEach((point, index) => {
            const isLast = index === lastIndex;
            const speed = isLast ? 1.1 : 0.6;
            const phase = index * 0.35;
            const pulse = (Math.sin(t * speed + phase) + 1) / 2;

            const baseRadius = isLast ? 6 : 5;
            const glowRadius = baseRadius + pulse * (isLast ? 9 : 5);
            const glowAlpha = (isLast ? 0.32 : 0.20) * (0.4 + pulse * 0.6);

            ctx.save();
            ctx.beginPath();
            ctx.arc(point.x, point.y, glowRadius, 0, Math.PI * 2);
            ctx.fillStyle = isLast ? `rgba(16, 185, 129, ${glowAlpha})` : `rgba(59, 130, 246, ${glowAlpha})`;
            ctx.fill();
            ctx.restore();

            if (isLast) {
                const ringRadius = baseRadius + 4 + pulse * 12;
                const ringAlpha = 0.55 * (1 - pulse);
                ctx.save();
                ctx.beginPath();
                ctx.arc(point.x, point.y, ringRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(16, 185, 129, ${ringAlpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }
        });
    }
};
Chart.register(pulsePointsPlugin);

const peakAnnotationPlugin = {
    id: 'peakAnnotationPlugin',
    afterDatasetsDraw(chart) {
        if (chart.canvas.id !== 'lineChart') return;
        const meta = chart.getDatasetMeta(0);
        const dataset = chart.data.datasets[0];
        if (!meta || !dataset || !dataset.data || !dataset.data.length) return;
        let maxVal = -Infinity, maxIdx = -1;
        dataset.data.forEach((v, i) => { if (v > maxVal) { maxVal = v; maxIdx = i; } });
        if (maxIdx === -1) return;
        const point = meta.data[maxIdx];
        const label = chart.data.labels[maxIdx];
        const { ctx } = chart;
        ctx.save();
        ctx.font = 'bold 10px Inter, sans-serif';
        ctx.fillStyle = '#f59e0b';
        ctx.textAlign = 'center';
        ctx.fillText(`Pico: ${label} • ${fmt(maxVal)}`, point.x, Math.max(14, point.y - 24));
        ctx.restore();
    }
};
Chart.register(peakAnnotationPlugin);

function fmt(num) {
    return Number(num || 0).toLocaleString('pt-BR');
}

function fmtMoeda(val) {
    return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function showToast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
}

function padronizarNome(nome) {
    if (!nome) return 'NÃO INFORMADO';
    return String(nome).toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function safeString(value, fallback = 'N/A') {
    if (value === null || value === undefined) return fallback;
    const str = String(value).trim();
    return str ? str : fallback;
}

function safeNumber(value, fallback = 0) {
    if (value === null || value === undefined || value === '') return fallback;
    const n = Number(String(value).replace(/[^\d,.-]/g, '').replace('.', '').replace(',', '.'));
    return Number.isFinite(n) ? n : fallback;
}

function safeDate(value, fallback = '') {
    const raw = safeString(value, fallback);
    return raw && raw.includes('T') ? raw.split('T')[0] : raw;
}

function normalizeStatus(status) {
    const raw = safeString(status, 'OUTRO').toUpperCase();
    if (raw.includes('CONCLUIDO') || raw.includes('CONCLUÍDO')) return 'CONCLUÍDO';
    if (raw.includes('ANDAMENTO') || raw.includes('ROTA')) return 'EM ANDAMENTO';
    if (raw.includes('PERNOITE')) return 'PERNOITE';
    return raw || 'OUTRO';
}

function buildFallbackData() {
    const hoje = new Date();
    const dates = Array.from({ length: 12 }, (_, index) => {
        const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() - (11 - index));
        return d.toISOString().split('T')[0];
    });

    return dates.map((date, index) => ({
        id: 1000 + index,
        criado: date,
        documento: `DOC-${String(index + 1).padStart(4, '0')}`,
        motorista: `Motorista ${index + 1}`,
        qtdNFs: 40 + index * 6,
        kmInicial: 1200 + index * 80,
        kmFinal: 1500 + index * 90,
        kmRodados: 280 + index * 10,
        status: index % 3 === 0 ? 'CONCLUÍDO' : index % 3 === 1 ? 'EM ANDAMENTO' : 'PERNOITE',
        perfil: index % 2 === 0 ? 'PRÓPRIO' : 'AGREGADO',
        operacao: `CLIENTE ${index + 1} | SP`,
        uf: ['SP', 'RJ', 'MG', 'PR', 'SC'][index % 5],
        observacao: `PLACA-${index + 1}`
    }));
}

function buildFallbackDespData() {
    const hoje = new Date();
    return Array.from({ length: 18 }, (_, index) => {
        const date = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() - (17 - index));
        const status = ['Aprovado', 'Pendente', 'Recusado'][index % 3];
        return {
            id: 2000 + index,
            placa: `ABC-${String((index % 9) + 1).padStart(4, '0')}`,
            servico: ['Combustível', 'Manutenção', 'Pneus', 'Pedágio'][index % 4],
            valorTotal: 250 + index * 65,
            valorUnit: 120 + index * 12,
            qntd: 1 + (index % 4),
            dataCompra: date.toISOString().split('T')[0],
            status,
            aprovador: status === 'Aprovado' ? 'Gestor' : status === 'Pendente' ? 'Financeiro' : 'Diretoria',
            tipoDoc: ['NF', 'Recibo', 'Boleto'][index % 3],
            formaPag: ['Pix', 'Transferência', 'Cartão'][index % 3],
            fornecedor: `Fornecedor ${index + 1}`,
            criadoPor: `Usuário ${index + 1}`,
            informacao: `Dados do registro ${index + 1}`,
            umb: 'UN',
            banco: 'Banco do Brasil',
            chavePix: 'pix@example.com',
            bancoAjud: 'N/A',
            chaveAjud: 'N/A',
            recebedor: `Recebedor ${index + 1}`,
            descontos: 0,
            operacao: `Operação ${index + 1}`,
            anexo: '',
            descFunc: 'N/A',
            parcelado: 'NÃO',
            numParcelas: 1,
            periodoParcelamento: 'N/A'
        };
    });
}

async function acquireTokenForGraph(account) {
    if (!account) throw new Error('Conta Microsoft não encontrada.');

    try {
        return await myMSALObj.acquireTokenSilent({ ...loginRequest, account });
    } catch (error) {
        console.warn('Token silencioso falhou, tentando popup:', error);
        return await myMSALObj.loginPopup(loginRequest).then((response) => {
            document.getElementById('display-name').innerText = response.account.name;
            return myMSALObj.acquireTokenSilent({ ...loginRequest, account: response.account });
        });
    }
}

async function fetchGraphList(url, token) {
    const headers = { Authorization: `Bearer ${token.accessToken}` };
    let all = [];
    let nextUrl = url;
    let pages = 0;

    while (nextUrl && pages < 10) {
        pages += 1;
        const res = await fetch(nextUrl, { headers });
        if (!res.ok) {
            throw new Error(`Graph erro (${res.status})`);
        }
        const data = await res.json();
        if (Array.isArray(data.value)) all = all.concat(data.value);
        nextUrl = data['@odata.nextLink'] || null;
    }

    return all;
}

async function syncSharePointData(account) {
    if (!account) account = myMSALObj.getAllAccounts()?.[0] || null;
    if (!account) {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('login-view').style.display = 'flex';
        showToast('Você precisa autenticar antes de sincronizar.');
        return;
    }

    document.getElementById('loading-screen').style.display = 'flex';
    document.getElementById('loading-msg').innerText = 'Sincronizando dados com o SharePoint...';

    try {
        const token = await acquireTokenForGraph(account);

        let listLiberacao = [];
        let listDespesas = [];

        try {
            const liberacaoUrl = 'https://graph.microsoft.com/v1.0/sites/willtech7.sharepoint.com:/sites/CARGOVAN:/lists/LIBERACAO_VEICULO/items?expand=fields&$top=1000';
            listLiberacao = await fetchGraphList(liberacaoUrl, token);
        } catch (error) {
            console.warn('Erro ao buscar LIBERACAO_VEICULO, usando fallback:', error);
        }

        try {
            const despUrl = 'https://graph.microsoft.com/v1.0/sites/willtech7.sharepoint.com:/sites/CARGOVAN:/lists/BD_DESPESAS/items?expand=fields&$top=1000';
            listDespesas = await fetchGraphList(despUrl, token);
        } catch (error) {
            console.warn('Erro ao buscar BD_DESPESAS, usando fallback:', error);
        }

        rawData = listLiberacao.length ? listLiberacao.map((it) => {
            const f = it.fields || {};
            const perfilStr = safeString(f.PR_x00d3_PRIOOUAGREGADO || f.PERFILDOVE_x00cd_CULO || 'PRÓPRIO').toUpperCase();
            const qNfs = safeNumber(f.QNTDDEENTREGA || f.QTDENTREGASFINALIZADAS || 0, 0);
            const kmIni = safeNumber(f.KMINICIAL || 0, 0);
            const kmFin = safeNumber(f.KMFINAL || 0, 0);
            const kmRod = safeNumber(f.KMRODADOS || 0, 0) || (kmFin > kmIni ? kmFin - kmIni : 0);
            const operacaoStr = safeString(f.CLIENTE_x007c_OPERA_x00c7__x00c3 || 'NÃO INFORMADA').toUpperCase();
            let uf = 'GERAL';
            const parts = operacaoStr.split('|');
            if (parts.length > 1 && parts[0].trim().length === 2) uf = parts[0].trim().toUpperCase();

            return {
                id: it.id,
                criado: safeDate(f.Created || new Date().toISOString(), ''),
                documento: safeString(f.N_x00ba_DOCUMENTO || 'N/A'),
                motorista: padronizarNome(f.NOME),
                qtdNFs: qNfs,
                kmInicial: kmIni,
                kmFinal: kmFin,
                kmRodados: kmRod,
                status: normalizeStatus(f.STATUS || 'CONCLUÍDO'),
                perfil: perfilStr.includes('AGREGADO') ? 'AGREGADO' : 'PRÓPRIO',
                operacao: operacaoStr,
                uf,
                observacao: safeString(f.OBSERVA_x00c7__x00c3_O || '').toUpperCase()
            };
        }) : buildFallbackData();

        rawDespData = listDespesas.length ? listDespesas.map((it) => {
            const f = it.fields || {};
            return {
                id: it.id,
                placa: safeString(f.PLACA || f.Placa || 'N/A').toUpperCase(),
                servico: safeString(f.SERVI_x00c7_O || f.SERVICO || f.Servico || 'N/A').toUpperCase(),
                valorTotal: safeNumber(f.VALORTOTAL || f.VALOR_x0020_TOTAL || f.ValorTotal || 0, 0),
                valorUnit: safeNumber(f.VALORUNIT_x00c1_RIO || f.VALOR_x0020_UNIT_x00c1_RIO || f.ValorUnitario || 0, 0),
                qntd: safeNumber(f.QNTD || f.QUANTIDADE || f.Quantidade || 1, 1),
                dataCompra: safeDate(f.DATA_x0020_DE_x0020_COMPRA || f.DATACOMPRA || f.Created || new Date().toISOString(), ''),
                status: safeString(f.STATUS || f.Status || 'Pendente').trim(),
                aprovador: safeString(f.APROVADOR || f.Aprovador || 'N/A'),
                tipoDoc: safeString(f.TIPO_x0020_DOCUMENTO || f.TIPODOCUMENTO || f.TipoDoc || 'N/A'),
                formaPag: safeString(f.FORMA_x0020_PAGAMENTO || f.FORMAPAGAMENTO || f.FormaPagamento || 'N/A'),
                fornecedor: safeString(f.FORNECEDOR || f.Fornecedor || 'N/A'),
                criadoPor: safeString(f.CRIADO_x0020_POR || f.CRIADOPOR || f.Author || 'N/A'),
                informacao: safeString(f.INFORMA_x00c7__x00c3_O || f.INFORMACAO || f.Informacao || 'N/A'),
                umb: safeString(f.UMB || f.Umb || 'N/A'),
                banco: safeString(f.BANCO || f.Banco || 'N/A'),
                chavePix: safeString(f.CHAVE_x0020_PIX || f.CHAVEPIX || f.ChavePix || 'N/A'),
                bancoAjud: safeString(f.BANCO_x0020_AJUDANTE || f.BANCOAJUDANTE || f.BancoAjudante || 'N/A'),
                chaveAjud: safeString(f.CHAVE_x0020_AJUDANTE || f.CHAVEAJUDANTE || f.ChaveAjudante || 'N/A'),
                recebedor: safeString(f.RECEBEDOR || f.Recebedor || 'N/A'),
                descontos: safeNumber(f.DESCONTOS || f.Descontos || 0, 0),
                operacao: safeString(f.OPERA_x00c7__x00c3_O || f.OPERACAO || f.Operacao || 'N/A'),
                anexo: safeString(f.ANEXO || f.Anexo || '', ''),
                descFunc: safeString(f.DESC_x0020_FUNC || f.DESCFUNC || f.DescFunc || 'N/A'),
                parcelado: safeString(f.PARCELADO || f.Parcelado || 'NÃO'),
                numParcelas: safeNumber(f.N_x00ba__x0020_PARCELAS || f.NUMPARCELAS || f.NumParcelas || 1, 1),
                periodoParcelamento: safeString(f.PER_x00cd_ODO_x0020_PARCELAMENTO || f.PERIODOPARCELAMENTO || 'N/A')
            };
        }) : buildFallbackDespData();

        document.getElementById('display-name').innerText = account.name || 'Usuário';
        showToast(`✅ Sincronizado: ${rawData.length} Veículos | ${rawDespData.length} Despesas`);
    } catch (error) {
        console.error(error);
        rawData = buildFallbackData();
        rawDespData = buildFallbackDespData();
        document.getElementById('display-name').innerText = account.name || 'Usuário';
        showToast('⚠️ Dados de demonstração carregados.');
    } finally {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        if (typeof popularFiltrosDinamicos === 'function') popularFiltrosDinamicos();
        if (typeof applyFilters === 'function') applyFilters();
        if (typeof applyDespFilters === 'function') applyDespFilters();
    }
}

function iniciarLogin() {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('loading-screen').style.display = 'flex';
    myMSALObj.loginPopup(loginRequest)
        .then(response => {
            document.getElementById('display-name').innerText = response.account.name;
            syncSharePointData(response.account);
        })
        .catch(error => {
            console.error(error);
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('login-view').style.display = 'flex';
            showToast('Erro ao conectar.');
        });
}
