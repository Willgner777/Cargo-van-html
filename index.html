<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Premium - Gestão de Operações</title>
    
    <!-- Tailwind CSS para estruturação rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js e ChartDataLabels -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <style>
        /* =========================================================
           TEMAS E EFEITOS (GLASSMORPHISM & NEON)
           ========================================================= */
        :root {
            --bg-color: #0f172a; 
            --card-bg: rgba(30, 41, 59, 0.7); 
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-glow: 0 0 15px rgba(59, 130, 246, 0.5);
            --success-glow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(30, 64, 175, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1), transparent 40%);
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), var(--accent-glow);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-cyan { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }
        .badge-emerald { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        .progress-bar-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 999px;
            overflow: hidden;
            height: 8px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
        }
        
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            border-radius: 999px;
            box-shadow: var(--accent-glow);
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            color: #fff;
            color-scheme: dark;
        }
        .glass-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="p-6">

    <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">
                Performance de Operações
            </h1>
            <p class="text-slate-400 text-sm mt-1">Sincronizado via MSAL & SharePoint | Atualização em tempo real</p>
        </div>
        
        <div class="glass-card p-2 px-4 flex items-center gap-3">
            <label class="text-sm text-slate-300">Período:</label>
            <input type="date" id="filter-start" class="glass-input rounded-md px-2 py-1 text-sm" value="2026-09-01">
            <span class="text-slate-500">até</span>
            <input type="date" id="filter-end" class="glass-input rounded-md px-2 py-1 text-sm" value="2026-09-30">
            <button onclick="updateDashboard()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-md text-sm transition-colors shadow-[0_0_10px_rgba(37,99,235,0.4)]">
                Filtrar
            </button>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <div class="glass-card p-6 flex flex-col justify-between">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span class="badge-pill badge-cyan mb-2">KPI Principal</span>
                    <h2 class="text-lg font-semibold text-slate-200">Meta Mensal (NFs)</h2>
                </div>
                <div class="p-2 bg-blue-500/10 rounded-lg border border-blue-500/20 text-blue-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                </div>
            </div>
            
            <div class="mt-2">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-3xl font-bold" id="meta-mensal-atual">0</span>
                    <span class="text-sm text-slate-400">de <span id="meta-mensal-alvo" class="text-slate-200">0</span> alvo</span>
                </div>
                <div class="progress-bar-container">
                    <div id="meta-mensal-fill" class="progress-bar-fill" style="width: 0%;"></div>
                </div>
                <div class="mt-2 text-right">
                    <span id="meta-mensal-pct" class="text-sm font-medium text-cyan-400 cursor-help">0%</span>
                </div>
            </div>
        </div>

        <div class="glass-card p-6 lg:col-span-2">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-200">Evolução de Entregas</h2>
                <span class="badge-pill badge-emerald">Tempo Real</span>
            </div>
            <div class="relative h-48">
                <canvas id="lineChart"></canvas>
            </div>
        </div>

        <div class="glass-card p-6 lg:col-span-3">
            <h2 class="text-lg font-semibold text-slate-200 mb-4">Performance por Operação vs Meta Dinâmica</h2>
            <div class="relative h-72">
                <canvas id="opTargetChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let opTargetChartInstance = null;
        let lineChartInstance = null;
        const fmt = (num) => new Intl.NumberFormat('pt-BR').format(num);

        /* =========================================================
           PLUGIN VISUAL: PULSO NEON MULTI-GRÁFICO
           ========================================================= */
        const globalPulsePlugin = {
            id: 'globalPulsePlugin',
            afterDatasetsDraw(chart) {
                const ctx = chart.ctx;
                const t = performance.now() / 1000;
                const pulse = (Math.sin(t * 2) + 1) / 2;

                chart.data.datasets.forEach((dataset, datasetIndex) => {
                    const meta = chart.getDatasetMeta(datasetIndex);
                    if (!meta || !meta.data || meta.data.length === 0) return;

                    const lastIdx = meta.data.length - 1;
                    const point = meta.data[lastIdx];

                    if (point && point.x !== undefined && point.y !== undefined) {
                        ctx.save();
                        ctx.beginPath();
                        
                        if (chart.config.type === 'bar') {
                            ctx.arc(point.x + 5, point.y, 4 + pulse * 4, 0, Math.PI * 2);
                        } else {
                            ctx.arc(point.x, point.y, 6 + pulse * 6, 0, Math.PI * 2);
                        }
                        
                        ctx.fillStyle = `rgba(59, 130, 246, ${0.4 - pulse * 0.3})`;
                        ctx.fill();
                        ctx.restore();
                    }
                });
            }
        };
        Chart.register(globalPulsePlugin);
        Chart.register(ChartDataLabels);

        setInterval(() => {
            if (lineChartInstance) lineChartInstance.draw();
            if (opTargetChartInstance) opTargetChartInstance.draw();
        }, 80);

        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(15, 23, 42, 0.9)';
        Chart.defaults.plugins.tooltip.titleColor = '#fff';
        Chart.defaults.plugins.tooltip.bodyColor = '#cbd5e1';
        Chart.defaults.plugins.tooltip.borderColor = 'rgba(59, 130, 246, 0.5)';
        Chart.defaults.plugins.tooltip.borderWidth = 1;
        Chart.defaults.plugins.tooltip.cornerRadius = 8;
        Chart.defaults.plugins.tooltip.displayColors = false;

        /* =========================================================
           LÓGICA E METAS
           ========================================================= */
        function countWorkingDays(startStr, endStr) {
            if (!startStr || !endStr) return 26; 
            let inicio = new Date(startStr + 'T00:00:00');
            let fim = new Date(endStr + 'T00:00:00');
            if (inicio > fim) [inicio, fim] = [fim, inicio];
            let dias = 0;
            const cur = new Date(inicio);
            while (cur <= fim) {
                const d = cur.getDay();
                if (d >= 1 && d <= 6) dias++; // Seg a Sab
                cur.setDate(cur.getDate() + 1);
            }
            return dias;
        }

        function renderMetaMensal(totalNFs) {
            const META_MENSAL_NFS = 20306;
            const start = document.getElementById('filter-start').value;
            const end = document.getElementById('filter-end').value;
            const diasUteis = countWorkingDays(start, end);
            
            const metaPeriodo = Math.round((META_MENSAL_NFS / 26) * diasUteis);
            const pct = metaPeriodo > 0 ? Math.max(0, Math.min(100, Math.round((totalNFs / metaPeriodo) * 100))) : 0;
            
            document.getElementById('meta-mensal-fill').style.width = pct + '%';
            document.getElementById('meta-mensal-atual').innerText = fmt(totalNFs);
            document.getElementById('meta-mensal-alvo').innerText = fmt(metaPeriodo);
            const elPct = document.getElementById('meta-mensal-pct');
            if(elPct) {
                elPct.innerText = pct + '%';
                elPct.title = `${diasUteis} dias úteis no período.`;
            }
        }

        function updateOpTargetChart(data) {
            const META_OPERACAO_MENSAL = 500;
            const start = document.getElementById('filter-start').value;
            const end = document.getElementById('filter-end').value;
            const diasUteis = countWorkingDays(start, end);
            const META_OPERACAO = Math.round((META_OPERACAO_MENSAL / 26) * diasUteis);

            const opMap = {};
            data.forEach(d => { opMap[d.operacao] = (opMap[d.operacao] || 0) + d.qtdNFs; });
            const sorted = Object.entries(opMap).sort((a, b) => b[1] - a[1]).slice(0, 7);

            const ctx = document.getElementById('opTargetChart').getContext('2d');
            if (opTargetChartInstance) opTargetChartInstance.destroy();

            opTargetChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sorted.map(i => i[0]),
                    datasets: [{
                        label: 'NFs Entregues',
                        data: sorted.map(i => i[1]),
                        // AQUI ESTÁ A CORREÇÃO DO CORTE!
                        backgroundColor: sorted.map(i => i[1] >= META_OPERACAO 
                            ? 'rgba(16, 185, 129, 0.85)' // Esmeralda se bateu a meta
                            : 'rgba(59, 130, 246, 0.85)'), // Azul se não bateu
                        borderRadius: 8,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 600, easing: 'easeOutQuart' },
                    plugins: {
                        legend: { display: false },
                        datalabels: { 
                            display: true, color: '#fff', anchor: 'end', align: 'left',
                            formatter: (v) => fmt(v) 
                        }
                    },
                    scales: {
                        x: { display: false, beginAtZero: true, grace: '10%' },
                        y: { grid: { display: false, color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        function updateLineChart(data) {
            const dateMap = {};
            data.forEach(d => {
                const dateKey = d.dataEntrega.substring(0,10);
                dateMap[dateKey] = (dateMap[dateKey] || 0) + d.qtdNFs;
            });
            
            const sortedDates = Object.keys(dateMap).sort((a, b) => new Date(a) - new Date(b));
            const chartData = sortedDates.map(date => dateMap[date]);

            const ctx = document.getElementById('lineChart').getContext('2d');
            
            // Criar gradiente para a linha
            let gradient = ctx.createLinearGradient(0, 0, 0, 200);
            gradient.addColorStop(0, 'rgba(59, 130, 246, 0.5)');
            gradient.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

            if (lineChartInstance) lineChartInstance.destroy();

            lineChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedDates,
                    datasets: [{
                        label: 'NFs',
                        data: chartData,
                        borderColor: '#3b82f6',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#0f172a',
                        pointBorderColor: '#3b82f6',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    animation: { duration: 600, easing: 'easeOutQuart' },
                    plugins: {
                        legend: { display: false },
                        datalabels: { display: false }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 7 } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true }
                    }
                }
            });
        }

        // Função principal que orquestra a atualização (Simulando o Fetch do SharePoint)
        function updateDashboard() {
            // Simulando alguns dados para preencher o visual
            const mockData = [
                { operacao: 'Operação A', qtdNFs: 650, dataEntrega: '2026-09-02' },
                { operacao: 'Operação A', qtdNFs: 200, dataEntrega: '2026-09-05' },
                { operacao: 'Operação B', qtdNFs: 420, dataEntrega: '2026-09-03' },
                { operacao: 'Operação C', qtdNFs: 810, dataEntrega: '2026-09-08' },
                { operacao: 'Operação D', qtdNFs: 300, dataEntrega: '2026-09-01' },
                { operacao: 'Operação E', qtdNFs: 550, dataEntrega: '2026-09-10' },
                { operacao: 'Operação F', qtdNFs: 120, dataEntrega: '2026-09-12' }
            ];
            
            const totalNFs = mockData.reduce((acc, curr) => acc + curr.qtdNFs, 0) + 12000; // +12000 para simular um volume maior
            
            renderMetaMensal(totalNFs);
            updateOpTargetChart(mockData);
            updateLineChart(mockData);
        }

        // Inicializar
        window.onload = updateDashboard;
    </script>
</body>
</html>
